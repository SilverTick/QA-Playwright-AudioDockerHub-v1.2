
name: Playwright Tests with Docker and Allure

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: allure-pages
  cancel-in-progress: false

jobs:
  test:
    name: Docker Deployment and Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ENV: sit
      BASE_URL: http://127.0.0.1:5010

      COMMONUSER01_PASSWORD: ${{ secrets.COMMONUSER01_PASSWORD }}
      COMMONUSER02_PASSWORD: ${{ secrets.COMMONUSER02_PASSWORD }}
      COMMONUSER03_PASSWORD: ${{ secrets.COMMONUSER03_PASSWORD }}
      ADMINUSER01_PASSWORD: ${{ secrets.ADMINUSER01_PASSWORD }}

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install npm dependencies
        run: npm ci

      # 4. Build and start Docker environment
      - name: Build and start Docker containers
        run: docker compose -f docker-compose.yaml up -d --build

      # 5. Check Docker containers
      - name: Check Docker containers
        run: docker compose ps

      # 6. Wait for AudioHub application
      - name: Wait for AudioHub application
        shell: bash
        run: |
          echo "Waiting for AudioHub..."

          for i in {1..60}; do
            if curl -fsS --connect-timeout 3 \
              http://127.0.0.1:5010/api/checkusername/ci-health \
              -o /dev/null; then
              echo "AudioHub is ready!"
              exit 0
            fi

            echo "Waiting... ($i/60)"
            sleep 5
          done

          docker compose logs --no-color
          exit 1

      # 7. Install Chromium
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # 8. Execute Playwright tests
      - name: Run Playwright tests
        run: npx playwright test

      # 9. Collect Docker logs if anything failed
      - name: Collect Docker logs
        if: failure()
        run: docker compose logs --no-color

      # 10. Stop Docker environment
      - name: Stop Docker containers
        if: always()
        run: docker compose down

      # 11. Upload raw Allure results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 30

      # 12. Upload Playwright failure evidence
      - name: Upload Playwright test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # 13. Restore previous Allure history
      # First run: gh-pages may not exist yet.
      - name: Load Allure history
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # 14. Generate Allure HTML report
      - name: Generate Allure report
        id: allure_report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          gh_pages: gh-pages
          allure_results: allure-results
          allure_history: allure-history

      # 15. Verify generated report
      - name: Verify Allure HTML output
        if: always()
        run: |
          echo "Checking generated Allure report..."

          if [ -f allure-history/index.html ]; then
            echo "SUCCESS: Allure HTML report generated."
            find allure-history -maxdepth 2 -type f | head -30
          else
            echo "ERROR: Allure index.html not found."
            ls -la
            ls -la allure-results || true
            exit 1
          fi

      # 16. Upload generated HTML report
      - name: Upload Allure HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-${{ github.run_number }}
          path: allure-history/
          if-no-files-found: ignore
          retention-days: 30

      # 17. Publish report to GitHub Pages
      - name: Publish Allure report
        if: always() && github.event_name != 'pull_request' && steps.allure_report.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
