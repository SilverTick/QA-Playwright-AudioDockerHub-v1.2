
name: Playwright Tests with Docker

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Docker Deployment and Playwright Tests

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ENV: sit
      BASE_URL: http://127.0.0.1:5010

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install Playwright dependencies
      - name: Install npm dependencies
        run: npm ci

      # 4. Build and start Docker environment
      - name: Build and start Docker containers
        run: docker compose -f docker-compose.yaml up -d --build

      # 5. Verify Docker containers
      - name: Check Docker containers
        run: docker compose ps

      # 6. Wait for MongoDB-dependent application endpoint
      - name: Wait for AudioHub application
        shell: bash
        run: |
          echo "Waiting for AudioHub and MongoDB..."

          for i in {1..60}; do

            if curl -fsS \
              --connect-timeout 3 \
              http://127.0.0.1:5010/api/checkusername/ci-health \
              -o /dev/null; then

              echo "AudioHub and MongoDB are ready!"
              exit 0

            fi

            echo "Waiting for application... ($i/60)"
            sleep 5

          done

          echo "Application failed to become ready."
          docker compose logs --no-color
          exit 1

      # 7. Install Playwright Chromium
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 8. Execute Playwright tests
      - name: Run Playwright tests
        run: npx playwright test

      # 9. Upload Allure results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 30

      # 10. Collect Docker logs if something fails
      - name: Collect Docker logs
        if: failure()
        run: docker compose logs --no-color

      # 11. Shutdown Docker environment
      - name: Stop Docker containers
        if: always()
        run: docker compose down
